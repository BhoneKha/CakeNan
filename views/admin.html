<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
  <title>Orders · Cake Nan</title>
  <style>
    :root {
      --bg: #f6f5f3;
      --surface: #ffffff;
      --border: #e7e4df;
      --text: #1e1d1b;
      --muted: #75716b;
      --brand: #a8455f;
      --brand-dark: #87364c;
      --amber: #b26a00;
      --amber-bg: #fdf3e2;
      --green: #2f7a4a;
      --green-bg: #e7f4eb;
      --blue: #2c5d9c;
      --blue-bg: #e8f0fa;
      --red: #b3261e;
      --red-bg: #fbeae8;
      --gray-bg: #efede9;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
    }

    button { font: inherit; cursor: pointer; }
    a { color: inherit; }

    /* Top bar */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      height: 56px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { font-family: Georgia, serif; font-size: 20px; color: var(--brand); font-weight: 600; }
    .brand-sub { color: var(--muted); padding-left: 14px; border-left: 1px solid var(--border); }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 18px; color: var(--muted); font-size: 13px; }
    .link-btn { background: none; border: none; color: var(--brand); font-weight: 500; padding: 0; }
    .link-btn:hover { text-decoration: underline; }

    main { max-width: 1240px; margin: 0 auto; padding: 28px; }

    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.2px; }
    .subtitle { color: var(--muted); margin-top: 2px; }

    /* Summary */
    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 24px;
    }
    .summary-item { padding: 16px 20px; border-left: 1px solid var(--border); }
    .summary-item:first-child { border-left: none; }
    .summary-label { color: var(--muted); font-size: 13px; }
    .summary-value { font-size: 26px; font-weight: 600; margin-top: 2px; }
    .summary-value.attention { color: var(--amber); }

    /* Toolbar */
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); }
    .tab {
      background: none; border: none; padding: 8px 12px; color: var(--muted);
      border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--brand); }
    .tab .n { color: var(--muted); font-weight: 400; margin-left: 4px; }

    .search {
      width: 260px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); font: inherit; outline: none;
    }
    .search:focus { border-color: var(--brand); }

    /* Table */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; font-weight: 500; color: var(--muted); font-size: 13px;
      padding: 10px 16px; border-bottom: 1px solid var(--border); background: #fbfaf8;
    }
    td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #faf8f6; }
    tbody tr.cancelled td { color: var(--muted); }

    .order-no { font-weight: 600; white-space: nowrap; }
    .muted { color: var(--muted); }
    .small { font-size: 12.5px; }
    .items { max-width: 240px; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }

    .pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px;
      border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap;
    }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .s-pending   { background: var(--amber-bg); color: var(--amber); }
    .s-confirmed { background: var(--blue-bg); color: var(--blue); }
    .s-ready     { background: var(--green-bg); color: var(--green); }
    .s-completed { background: var(--gray-bg); color: var(--muted); }
    .s-cancelled { background: var(--red-bg); color: var(--red); }

    .pay-warn { color: var(--amber); }
    .pay-ok { color: var(--green); }

    .btn {
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      padding: 6px 12px; border-radius: 7px; font-weight: 500; white-space: nowrap;
    }
    .btn:hover { background: #f3f1ee; }
    .btn-primary { background: var(--brand); border-color: var(--brand); color: white; }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-danger { color: var(--red); }

    .empty { padding: 56px 20px; text-align: center; color: var(--muted); }
    .empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

    /* Side panel */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(30, 29, 27, 0.25); z-index: 20; }
    .overlay.open { display: block; }
    .panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 100%;
      background: var(--surface); border-left: 1px solid var(--border); z-index: 21;
      transform: translateX(100%); transition: transform 0.2s ease; overflow-y: auto;
    }
    .panel.open { transform: translateX(0); }
    .panel-head {
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start;
      position: sticky; top: 0; background: var(--surface);
    }
    .panel-head h2 { font-size: 18px; font-weight: 600; }
    .close { background: none; border: none; font-size: 22px; color: var(--muted); line-height: 1; padding: 2px 6px; }
    .panel-body { padding: 8px 24px 32px; }
    .section { padding: 18px 0; border-bottom: 1px solid var(--border); }
    .section:last-child { border-bottom: none; }
    .section h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; gap: 16px; padding: 3px 0; }
    .row span:first-child { color: var(--muted); }
    .row span:last-child { text-align: right; }
    .total-row { font-weight: 600; font-size: 15px; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 10px; }

    .status-picker { display: flex; flex-wrap: wrap; gap: 6px; }
    .status-picker .btn.current { background: var(--text); border-color: var(--text); color: white; }

    .slip { width: 100%; border-radius: 8px; border: 1px solid var(--border); margin: 10px 0; display: block; }
    .note { background: #fbfaf8; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 12px);
      background: var(--text); color: white; padding: 10px 16px; border-radius: 8px;
      opacity: 0; transition: all 0.2s; pointer-events: none; z-index: 30;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: var(--red); }

    @media (max-width: 860px) {
      main { padding: 16px; }
      .topbar { padding: 0 16px; }
      .brand-sub, .updated { display: none; }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .summary-item:nth-child(3) { border-left: none; }
      .summary-item:nth-child(n+3) { border-top: 1px solid var(--border); }
      .search { width: 100%; }
      .tabs { overflow-x: auto; width: 100%; }
      .hide-sm { display: none; }
      td, th { padding: 12px 10px; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <span class="brand">Cake Nan</span>
  <span class="brand-sub">Shop admin</span>
  <div class="topbar-right">
    <span class="updated" id="lastUpdated"></span>
    <button class="link-btn" onclick="loadOrders(true)">Refresh</button>
    <a class="link-btn" href="/" target="_blank" style="text-decoration:none;">View shop ↗</a>
  </div>
</header>

<main>
  <div class="page-head">
    <div>
      <h1>Orders</h1>
      <p class="subtitle" id="subtitle">Loading…</p>
    </div>
  </div>

  <section class="summary">
    <div class="summary-item">
      <div class="summary-label">New, need confirming</div>
      <div class="summary-value" id="sum-new">–</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">Slips to check</div>
      <div class="summary-value" id="sum-slips">–</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">Being prepared</div>
      <div class="summary-value" id="sum-progress">–</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">Sales today</div>
      <div class="summary-value" id="sum-sales">–</div>
    </div>
  </section>

  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <input class="search" id="search" type="search" placeholder="Search name, phone or order no." oninput="renderTable()" />
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Order</th>
          <th>Customer</th>
          <th class="hide-sm">Items</th>
          <th class="num">Total</th>
          <th class="hide-sm">Payment</th>
          <th>Status</th>
          <th class="hide-sm"></th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="7" class="empty">Loading orders…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div class="overlay" id="overlay" onclick="closeDetail()"></div>
<aside class="panel" id="panel" aria-label="Order details"></aside>
<div class="toast" id="toast"></div>

<script>
  const API = '/api';
  let orders = [];
  let filter = 'all';
  let openOrderId = null;

  const STATUS = {
    pending:   'New',
    confirmed: 'Confirmed',
    ready:     'Ready',
    completed: 'Completed',
    cancelled: 'Cancelled'
  };

  // What the main button on each row does next
  function nextStep(order) {
    if (order.status === 'pending') return { status: 'confirmed', label: 'Confirm' };
    if (order.status === 'confirmed') return { status: 'ready', label: 'Mark ready' };
    if (order.status === 'ready') {
      return { status: 'completed', label: order.fulfillment === 'pickup' ? 'Picked up' : 'Delivered' };
    }
    return null;
  }

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const baht = n => '฿' + Number(n || 0).toLocaleString();

  function timeAgo(iso) {
    const mins = Math.round((Date.now() - new Date(iso)) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins} min ago`;
    const hours = Math.round(mins / 60);
    if (hours < 24) return `${hours} hr ago`;
    return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }

  const slipNeedsCheck = o => o.payment.method === 'qr' && !o.payment.verified && o.status !== 'cancelled';

  async function api(path, options = {}) {
    const res = await fetch(API + path, {
      ...options,
      headers: options.body ? { 'Content-Type': 'application/json' } : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || `Server error (${res.status})`);
    return data;
  }

  // ── Load ────────────────────────────────────────────────
  async function loadOrders(manual) {
    try {
      const data = await api('/orders');
      orders = data.orders || [];
      renderSummary();
      renderTabs();
      renderTable();
      if (openOrderId) openDetail(openOrderId);
      document.getElementById('lastUpdated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      if (manual) toast('Orders refreshed');
    } catch (err) {
      document.getElementById('rows').innerHTML =
        `<tr><td colspan="7" class="empty"><strong>Couldn't load orders</strong>${esc(err.message)}. Check that the server is running.</td></tr>`;
    }
  }

  function renderSummary() {
    const today = new Date().toDateString();
    const todays = orders.filter(o => new Date(o.createdAt).toDateString() === today && o.status !== 'cancelled');
    const newCount = orders.filter(o => o.status === 'pending').length;
    const slips = orders.filter(slipNeedsCheck).length;

    document.getElementById('sum-new').textContent = newCount;
    document.getElementById('sum-new').classList.toggle('attention', newCount > 0);
    document.getElementById('sum-slips').textContent = slips;
    document.getElementById('sum-slips').classList.toggle('attention', slips > 0);
    document.getElementById('sum-progress').textContent = orders.filter(o => ['confirmed', 'ready'].includes(o.status)).length;
    document.getElementById('sum-sales').textContent = baht(todays.reduce((s, o) => s + o.total, 0));
    document.getElementById('subtitle').textContent =
      `${todays.length} order${todays.length === 1 ? '' : 's'} today` + (newCount ? ` · ${newCount} waiting for you` : '');
  }

  function renderTabs() {
    const tabs = [['all', 'All'], ...Object.entries(STATUS)];
    document.getElementById('tabs').innerHTML = tabs.map(([key, label]) => {
      const n = key === 'all' ? orders.length : orders.filter(o => o.status === key).length;
      return `<button class="tab ${filter === key ? 'active' : ''}" onclick="setFilter('${key}')">${label}<span class="n">${n}</span></button>`;
    }).join('');
  }

  function setFilter(key) {
    filter = key;
    renderTabs();
    renderTable();
  }

  function paymentText(o) {
    if (o.payment.method === 'cod') {
      return `<span class="muted">${o.fulfillment === 'pickup' ? 'Pay at shop' : 'Cash on delivery'}</span>`;
    }
    return o.payment.verified
      ? '<span class="pay-ok">PromptPay · paid</span>'
      : '<span class="pay-warn">PromptPay · check slip</span>';
  }

  function renderTable() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const list = orders.filter(o =>
      (filter === 'all' || o.status === filter) &&
      (!q || o.orderNumber.toLowerCase().includes(q) ||
             o.customer.name.toLowerCase().includes(q) ||
             o.customer.phone.toLowerCase().includes(q))
    );

    if (!list.length) {
      document.getElementById('rows').innerHTML = `<tr><td colspan="7" class="empty">
        <strong>${orders.length ? 'No matching orders' : 'No orders yet'}</strong>
        ${orders.length ? 'Try a different search or tab.' : 'New orders will show up here.'}</td></tr>`;
      return;
    }

    document.getElementById('rows').innerHTML = list.map(o => {
      const step = nextStep(o);
      const items = o.items.map(i => `${esc(i.name)} × ${i.quantity}`).join(', ');
      return `
        <tr class="${o.status === 'cancelled' ? 'cancelled' : ''}" onclick="openDetail('${o.id}')">
          <td>
            <div class="order-no">${esc(o.orderNumber)}</div>
            <div class="muted small">${timeAgo(o.createdAt)}</div>
          </td>
          <td>
            <div>${esc(o.customer.name)}</div>
            <div class="muted small">${o.fulfillment === 'pickup' ? 'Pickup' : 'Delivery'} · ${esc(o.customer.phone)}</div>
          </td>
          <td class="hide-sm items small">${items}</td>
          <td class="num">${baht(o.total)}</td>
          <td class="hide-sm small">${paymentText(o)}</td>
          <td><span class="pill s-${o.status}">${STATUS[o.status] || esc(o.status)}</span></td>
          <td class="num hide-sm" onclick="event.stopPropagation()">
            ${step ? `<button class="btn btn-primary" onclick="setStatus('${o.id}', '${step.status}')">${step.label}</button>` : ''}
          </td>
        </tr>`;
    }).join('');
  }

  // ── Actions ─────────────────────────────────────────────
  async function setStatus(id, status) {
    try {
      await api(`/orders/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status }) });
      toast(`Order marked as ${STATUS[status].toLowerCase()}`);
      await loadOrders();
    } catch (err) {
      toast(err.message, true);
    }
  }

  async function markPaid(id) {
    try {
      await api(`/orders/${id}/verify-payment`, { method: 'PATCH', body: JSON.stringify({ verified: true }) });
      toast('Payment marked as received');
      await loadOrders();
    } catch (err) {
      toast(err.message, true);
    }
  }

  async function deleteOrder(id) {
    const order = orders.find(o => o.id === id);
    if (!confirm(`Delete order ${order.orderNumber}? This can't be undone.`)) return;
    try {
      await api(`/orders/${id}`, { method: 'DELETE' });
      closeDetail();
      toast('Order deleted');
      await loadOrders();
    } catch (err) {
      toast(err.message, true);
    }
  }

  // ── Detail panel ────────────────────────────────────────
  function openDetail(id) {
    const o = orders.find(x => x.id === id);
    if (!o) return closeDetail();
    openOrderId = id;
    const step = nextStep(o);
    const created = new Date(o.createdAt).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

    document.getElementById('panel').innerHTML = `
      <div class="panel-head">
        <div>
          <h2>${esc(o.orderNumber)}</h2>
          <div class="muted small">Placed ${created}</div>
        </div>
        <button class="close" onclick="closeDetail()" aria-label="Close">×</button>
      </div>
      <div class="panel-body">
        <div class="section">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
            <span class="pill s-${o.status}">${STATUS[o.status]}</span>
            ${step ? `<button class="btn btn-primary" onclick="setStatus('${o.id}', '${step.status}')">${step.label}</button>` : ''}
          </div>
        </div>

        <div class="section">
          <h3>Customer</h3>
          <div class="row"><span>Name</span><span>${esc(o.customer.name)}</span></div>
          <div class="row"><span>Phone</span><span><a href="tel:${esc(o.customer.phone)}">${esc(o.customer.phone)}</a></span></div>
          <div class="row"><span>${o.fulfillment === 'pickup' ? 'Pickup' : 'Deliver to'}</span><span>${o.fulfillment === 'pickup' ? 'At the shop' : esc(o.customer.address)}</span></div>
          ${o.notes ? `<div class="note small" style="margin-top:10px;">${esc(o.notes)}</div>` : ''}
        </div>

        <div class="section">
          <h3>Items</h3>
          ${o.items.map(i => `<div class="row"><span>${esc(i.name)} × ${i.quantity}</span><span>${baht(i.price * i.quantity)}</span></div>`).join('')}
          <div class="row total-row"><span>Total</span><span>${baht(o.total)}</span></div>
        </div>

        <div class="section">
          <h3>Payment</h3>
          <div class="row"><span>Method</span><span>${paymentText(o)}</span></div>
          ${o.payment.slipUrl ? `<a href="${esc(o.payment.slipUrl)}" target="_blank"><img class="slip" src="${esc(o.payment.slipUrl)}" alt="Payment slip" /></a>` : ''}
          ${o.payment.method === 'qr' && !o.payment.verified
            ? `<button class="btn" onclick="markPaid('${o.id}')">Slip checked, mark as paid</button>` : ''}
        </div>

        <div class="section">
          <h3>Change status</h3>
          <div class="status-picker">
            ${Object.entries(STATUS).map(([key, label]) =>
              `<button class="btn ${o.status === key ? 'current' : ''}" onclick="setStatus('${o.id}', '${key}')">${label}</button>`
            ).join('')}
          </div>
        </div>

        <div class="section">
          <button class="btn btn-danger" onclick="deleteOrder('${o.id}')">Delete order</button>
        </div>
      </div>`;

    document.getElementById('panel').classList.add('open');
    document.getElementById('overlay').classList.add('open');
  }

  function closeDetail() {
    openOrderId = null;
    document.getElementById('panel').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

  let toastTimer;
  function toast(message, isError) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
  }

  loadOrders();
  setInterval(loadOrders, 30000);
</script>
</body>
</html>
