<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cake Nan — Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose: #c85a7c;
      --rose-light: #e8a0b4;
      --rose-pale: #fde8ef;
      --deep: #7a2d4a;
      --cream: #fffaf8;
      --blush: #fff0f4;
      --text: #3a3a3a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f0f2;
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .admin-header {
      background: var(--deep);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .admin-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--rose-light);
      letter-spacing: 2px;
    }

    .admin-logo span { color: rgba(255,255,255,0.4); font-size: 14px; font-weight: 300; margin-left: 12px; font-family: 'DM Sans', sans-serif; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .refresh-btn {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }

    .refresh-btn:hover { background: rgba(255,255,255,0.2); }

    .live-dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.3); }
    }

    /* ── STATS BAR ── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      padding: 24px 32px;
      background: white;
      border-bottom: 1px solid rgba(200,90,124,0.08);
    }

    .stat-card {
      background: var(--cream);
      border-radius: 16px;
      padding: 18px 20px;
      border: 1px solid rgba(200,90,124,0.08);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #aaa;
      font-weight: 500;
    }

    .stat-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      font-weight: 700;
      color: var(--deep);
      line-height: 1;
    }

    .stat-value.rose { color: var(--rose); }
    .stat-value.green { color: #1e7a45; }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 32px;
      background: white;
      border-bottom: 1px solid rgba(200,90,124,0.06);
      flex-wrap: wrap;
    }

    .toolbar input {
      padding: 10px 16px;
      border: 1.5px solid rgba(200,90,124,0.15);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      color: #555;
      width: 240px;
      transition: 0.2s;
    }

    .toolbar input:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px rgba(200,90,124,0.08);
    }

    .filter-btn {
      padding: 10px 18px;
      border: 1.5px solid rgba(200,90,124,0.15);
      border-radius: 10px;
      background: white;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      color: #777;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      border-color: var(--rose);
      background: var(--rose-pale);
      color: var(--deep);
    }

    .toolbar-right {
      margin-left: auto;
      font-size: 13px;
      color: #bbb;
    }

    /* ── TABLE ── */
    .table-wrap {
      padding: 24px 32px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.05);
    }

    thead {
      background: var(--deep);
      color: white;
    }

    thead th {
      padding: 16px 20px;
      text-align: left;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
    }

    tbody tr {
      border-bottom: 1px solid rgba(200,90,124,0.06);
      transition: background 0.15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fff8fb; }

    tbody td {
      padding: 16px 20px;
      font-size: 14px;
      color: #555;
      vertical-align: middle;
    }

    .order-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--deep);
    }

    .customer-name {
      font-weight: 600;
      color: #333;
    }

    .amount {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--rose);
    }

    /* Status badges */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .status-pending   { background: #fff3cd; color: #856404; }
    .status-confirmed { background: #d1ecf1; color: #0c5460; }
    .status-ready     { background: #d4edda; color: #155724; }
    .status-completed { background: #e2e3e5; color: #383d41; }
    .status-cancelled { background: #f8d7da; color: #721c24; }

    /* Fulfillment badge */
    .fulfillment-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 600;
    }

    .ff-delivery { background: #e8f4fd; color: #1565c0; }
    .ff-pickup   { background: #fce4ec; color: #880e4f; }

    /* Payment badge */
    .payment-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 600;
    }

    .pay-qr  { background: #ede7f6; color: #4527a0; }
    .pay-cod { background: #e8f5e9; color: #2e7d32; }

    /* Verification badge */
    .verify-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 600;
    }

    .verify-yes { background: #d4edda; color: #155724; }
    .verify-no  { background: #fff3cd; color: #856404; }
    .verify-na  { background: #f0f0f0; color: #888; }

    /* ── ACTION BUTTONS ── */
    .action-cell { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .status-select {
      padding: 6px 10px;
      border: 1.5px solid rgba(200,90,124,0.2);
      border-radius: 8px;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      color: #555;
      background: white;
      cursor: pointer;
      outline: none;
    }

    .status-select:focus { border-color: var(--rose); }

    .icon-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      transition: all 0.2s;
    }

    .icon-btn.view-slip  { background: #ede7f6; }
    .icon-btn.view-slip:hover  { background: #d1c4e9; }
    .icon-btn.verify-btn { background: #d4edda; }
    .icon-btn.verify-btn:hover { background: #c3e6cb; }
    .icon-btn.delete-btn { background: #f8d7da; }
    .icon-btn.delete-btn:hover { background: #f5c6cb; }

    /* ── SLIP MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: white;
      border-radius: 24px;
      padding: 36px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 40px 80px rgba(0,0,0,0.2);
      position: relative;
    }

    .modal h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      color: var(--deep);
      margin-bottom: 20px;
    }

    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      background: none; border: none;
      font-size: 20px; cursor: pointer;
      color: #bbb; transition: color 0.2s;
    }

    .modal-close:hover { color: var(--rose); }

    .modal img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(200,90,124,0.1);
      margin-bottom: 16px;
    }

    .modal-order-info p { font-size: 14px; color: #777; margin-bottom: 6px; }
    .modal-order-info strong { color: #333; }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }

    .modal-btn {
      flex: 1; padding: 12px;
      border-radius: 12px;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal-btn.primary { background: var(--rose); color: white; }
    .modal-btn.primary:hover { background: var(--deep); }
    .modal-btn.secondary { background: #f5f5f5; color: #555; }
    .modal-btn.secondary:hover { background: #e8e8e8; }

    /* ── ORDER DETAIL PANEL ── */
    .detail-panel {
      display: none;
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 420px;
      background: white;
      box-shadow: -20px 0 60px rgba(0,0,0,0.1);
      z-index: 200;
      overflow-y: auto;
      animation: slideIn 0.3s ease;
    }

    .detail-panel.open { display: block; }

    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .detail-header {
      background: var(--deep);
      padding: 28px 28px 24px;
      color: white;
    }

    .detail-header h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 300;
      margin-bottom: 4px;
    }

    .detail-header p { font-size: 13px; color: rgba(255,255,255,0.5); }

    .detail-close {
      position: absolute;
      top: 20px; right: 20px;
      background: rgba(255,255,255,0.1);
      border: none; color: white;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .detail-body { padding: 28px; }

    .detail-section {
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(200,90,124,0.08);
    }

    .detail-section:last-child { border-bottom: none; }

    .detail-section-title {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--rose);
      font-weight: 600;
      margin-bottom: 14px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .detail-row strong { color: #333; }

    .detail-item-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(200,90,124,0.06);
      font-size: 14px;
    }

    .detail-total {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      color: var(--rose);
      font-weight: 700;
      margin-top: 12px;
      text-align: right;
    }

    .detail-slip-img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(200,90,124,0.1);
      margin-top: 10px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #ccc;
    }

    .empty-state-icon { font-size: 60px; margin-bottom: 16px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 32px; right: 32px;
      background: var(--deep);
      color: white;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 9999;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: #1e7a45; }
    .toast.error { background: #c0392b; }

    @media (max-width: 900px) {
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .table-wrap { padding: 16px; }
      .detail-panel { width: 100%; }
    }
  </style>
</head>
<body>

<div class="admin-header">
  <div class="admin-logo">Cake Nan <span>Admin Dashboard</span></div>
  <div class="header-right">
    <div class="live-dot" title="Live data"></div>
    <button class="refresh-btn" onclick="loadOrders()">🔄 Refresh</button>
  </div>
</div>

<!-- STATS BAR -->
<div class="stats-bar" id="statsBar">
  <div class="stat-card">
    <div class="stat-label">Total Orders</div>
    <div class="stat-value rose" id="stat-total">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Pending</div>
    <div class="stat-value" style="color:#856404;" id="stat-pending">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Ready / Confirmed</div>
    <div class="stat-value" style="color:#0c5460;" id="stat-active">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Completed</div>
    <div class="stat-value green" id="stat-completed">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Today's Revenue</div>
    <div class="stat-value rose" id="stat-revenue">—</div>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <input type="text" id="searchOrders" placeholder="🔍  Search by name, phone, order #..." oninput="renderTable()" />
  <button class="filter-btn active" data-status="all" onclick="setFilter('all')">All</button>
  <button class="filter-btn" data-status="pending" onclick="setFilter('pending')">⏳ Pending</button>
  <button class="filter-btn" data-status="confirmed" onclick="setFilter('confirmed')">✅ Confirmed</button>
  <button class="filter-btn" data-status="ready" onclick="setFilter('ready')">🎁 Ready</button>
  <button class="filter-btn" data-status="completed" onclick="setFilter('completed')">✓ Completed</button>
  <button class="filter-btn" data-status="cancelled" onclick="setFilter('cancelled')">✕ Cancelled</button>
  <span class="toolbar-right" id="orderCount">Loading...</span>
</div>

<!-- TABLE -->
<div class="table-wrap">
  <table id="ordersTable">
    <thead>
      <tr>
        <th>Order #</th>
        <th>Customer</th>
        <th>Items</th>
        <th>Total</th>
        <th>Method</th>
        <th>Payment</th>
        <th>Slip</th>
        <th>Status</th>
        <th>Time</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="ordersBody">
      <tr><td colspan="10" style="text-align:center; padding:40px; color:#ccc;">Loading orders...</td></tr>
    </tbody>
  </table>
</div>

<!-- SLIP MODAL -->
<div class="modal-overlay" id="slipModal">
  <div class="modal">
    <button class="modal-close" onclick="closeSlipModal()">✕</button>
    <h3>🧾 Payment Slip</h3>
    <img id="slipModalImg" src="" alt="Payment slip" />
    <div class="modal-order-info" id="slipModalInfo"></div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeSlipModal()">Close</button>
      <button class="modal-btn primary" id="verifySlipBtn" onclick="verifyFromModal()">✓ Verify Payment</button>
    </div>
  </div>
</div>

<!-- ORDER DETAIL PANEL -->
<div class="detail-panel" id="detailPanel">
  <div class="detail-header">
    <button class="detail-close" onclick="closeDetail()">✕</button>
    <h3 id="detailOrderNum">Order</h3>
    <p id="detailTime"></p>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  const API = '/api';

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  let allOrders = [];
  let filterStatus = 'all';
  let currentSlipOrderId = null;

  // ── LOAD ORDERS ───────────────────────────────────────────
  async function loadOrders() {
    try {
      const res = await fetch(`${API}/orders`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      allOrders = data.orders || [];
      updateStats();
      renderTable();
    } catch (err) {
      document.getElementById('ordersBody').innerHTML =
        `<tr><td colspan="10" style="text-align:center; padding:40px; color:#e05555;">
          ❌ Could not load orders. Make sure the server is running, then refresh.
        </td></tr>`;
    }
  }

  // ── STATS ─────────────────────────────────────────────────
  function updateStats() {
    const today = new Date().toDateString();
    const todayRevenue = allOrders
      .filter(o => new Date(o.createdAt).toDateString() === today && o.status !== 'cancelled')
      .reduce((s, o) => s + o.total, 0);

    document.getElementById('stat-total').textContent = allOrders.length;
    document.getElementById('stat-pending').textContent = allOrders.filter(o => o.status === 'pending').length;
    document.getElementById('stat-active').textContent = allOrders.filter(o => ['confirmed','ready'].includes(o.status)).length;
    document.getElementById('stat-completed').textContent = allOrders.filter(o => o.status === 'completed').length;
    document.getElementById('stat-revenue').textContent = '฿' + todayRevenue.toLocaleString();
  }

  // ── FILTER ────────────────────────────────────────────────
  function setFilter(status) {
    filterStatus = status;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.status === status);
    });
    renderTable();
  }

  // ── RENDER TABLE ──────────────────────────────────────────
  function renderTable() {
    const search = document.getElementById('searchOrders').value.toLowerCase();
    let filtered = allOrders.filter(o => {
      const matchStatus = filterStatus === 'all' || o.status === filterStatus;
      const matchSearch = !search ||
        o.orderNumber.toLowerCase().includes(search) ||
        o.customer.name.toLowerCase().includes(search) ||
        o.customer.phone.toLowerCase().includes(search);
      return matchStatus && matchSearch;
    });

    document.getElementById('orderCount').textContent = `${filtered.length} order${filtered.length !== 1 ? 's' : ''}`;

    if (filtered.length === 0) {
      document.getElementById('ordersBody').innerHTML =
        `<tr><td colspan="10"><div class="empty-state"><div class="empty-state-icon">🎂</div>No orders found</div></td></tr>`;
      return;
    }

    const rows = filtered.map(o => {
      const itemsSummary = o.items.map(i => `${esc(i.name)} ×${i.quantity}`).join(', ');
      const time = new Date(o.createdAt).toLocaleString('th-TH', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
      const ffClass = o.fulfillment === 'pickup' ? 'ff-pickup' : 'ff-delivery';
      const ffLabel = o.fulfillment === 'pickup' ? '🏪 Pickup' : '🚚 Delivery';
      const payClass = o.payment.method === 'qr' ? 'pay-qr' : 'pay-cod';
      const payLabel = o.payment.method === 'qr' ? '📱 QR' : '💵 COD';

      let verifyBadge = '';
      if (o.payment.method === 'qr') {
        verifyBadge = o.payment.verified
          ? '<span class="verify-badge verify-yes">✓ Verified</span>'
          : '<span class="verify-badge verify-no">⏳ Pending</span>';
      } else {
        verifyBadge = '<span class="verify-badge verify-na">N/A</span>';
      }

      const slipBtn = o.payment.slipFile
        ? `<button class="icon-btn view-slip" onclick="viewSlip('${o.id}')" title="View slip">🧾</button>`
        : '<span style="color:#ddd; font-size:12px;">—</span>';

      const verifyBtn = (o.payment.method === 'qr' && !o.payment.verified)
        ? `<button class="icon-btn verify-btn" onclick="verifyPayment('${o.id}')" title="Verify payment">✓</button>`
        : '';

      return `
        <tr onclick="openDetail('${o.id}')" style="cursor:pointer;">
          <td><div class="order-num">${o.orderNumber}</div></td>
          <td>
            <div class="customer-name">${esc(o.customer.name)}</div>
            <div style="font-size:12px; color:#bbb;">${esc(o.customer.phone)}</div>
          </td>
          <td style="max-width:180px; font-size:12px; color:#888;">${itemsSummary}</td>
          <td><div class="amount">฿${o.total.toLocaleString()}</div></td>
          <td><span class="fulfillment-badge ${ffClass}">${ffLabel}</span></td>
          <td>
            <span class="payment-badge ${payClass}">${payLabel}</span><br>
            <div style="margin-top:4px;">${verifyBadge}</div>
          </td>
          <td onclick="event.stopPropagation()">${slipBtn}</td>
          <td>
            <span class="status-badge status-${o.status}">
              ${statusLabel(o.status)}
            </span>
          </td>
          <td style="font-size:12px; color:#bbb; white-space:nowrap;">${time}</td>
          <td onclick="event.stopPropagation()">
            <div class="action-cell">
              <select class="status-select" onchange="updateStatus('${o.id}', this.value)" title="Change status">
                <option value="">Change...</option>
                <option value="pending">⏳ Pending</option>
                <option value="confirmed">✅ Confirmed</option>
                <option value="ready">🎁 Ready</option>
                <option value="completed">✓ Completed</option>
                <option value="cancelled">✕ Cancelled</option>
              </select>
              ${verifyBtn}
              <button class="icon-btn delete-btn" onclick="deleteOrder('${o.id}')" title="Delete order">🗑️</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');

    document.getElementById('ordersBody').innerHTML = rows;
  }

  function statusLabel(s) {
    return {
      pending: '⏳ Pending',
      confirmed: '✅ Confirmed',
      ready: '🎁 Ready',
      completed: '✓ Completed',
      cancelled: '✕ Cancelled'
    }[s] || s;
  }

  // ── UPDATE STATUS ─────────────────────────────────────────
  async function updateStatus(id, status) {
    if (!status) return;
    try {
      await fetch(`${API}/orders/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      showToast(`Status updated to ${status}`, 'success');
      await loadOrders();
    } catch {
      showToast('Failed to update status', 'error');
    }
  }

  // ── VERIFY PAYMENT ────────────────────────────────────────
  async function verifyPayment(id) {
    try {
      await fetch(`${API}/orders/${id}/verify-payment`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ verified: true })
      });
      showToast('Payment verified! ✓', 'success');
      await loadOrders();
    } catch {
      showToast('Failed to verify payment', 'error');
    }
  }

  // ── DELETE ORDER ──────────────────────────────────────────
  async function deleteOrder(id) {
    if (!confirm('Delete this order? This cannot be undone.')) return;
    try {
      await fetch(`${API}/orders/${id}`, { method: 'DELETE' });
      showToast('Order deleted', 'success');
      closeDetail();
      await loadOrders();
    } catch {
      showToast('Failed to delete order', 'error');
    }
  }

  // ── VIEW SLIP ─────────────────────────────────────────────
  function viewSlip(id) {
    const order = allOrders.find(o => o.id === id);
    if (!order || !order.payment.slipFile) return;
    currentSlipOrderId = id;

    document.getElementById('slipModalImg').src = order.payment.slipUrl;
    document.getElementById('slipModalInfo').innerHTML = `
      <p><strong>Order:</strong> ${order.orderNumber}</p>
      <p><strong>Customer:</strong> ${esc(order.customer.name)} · ${esc(order.customer.phone)}</p>
      <p><strong>Amount:</strong> ฿${order.total.toLocaleString()}</p>
      <p><strong>Verified:</strong> ${order.payment.verified ? '✅ Yes' : '⏳ Not yet'}</p>
    `;

    const verifyBtn = document.getElementById('verifySlipBtn');
    verifyBtn.style.display = order.payment.verified ? 'none' : 'block';

    document.getElementById('slipModal').classList.add('open');
  }

  function closeSlipModal() {
    document.getElementById('slipModal').classList.remove('open');
    currentSlipOrderId = null;
  }

  async function verifyFromModal() {
    if (!currentSlipOrderId) return;
    await verifyPayment(currentSlipOrderId);
    closeSlipModal();
  }

  // ── ORDER DETAIL PANEL ────────────────────────────────────
  function openDetail(id) {
    const order = allOrders.find(o => o.id === id);
    if (!order) return;

    document.getElementById('detailOrderNum').textContent = order.orderNumber;
    document.getElementById('detailTime').textContent = new Date(order.createdAt).toLocaleString();

    const ffLabel = order.fulfillment === 'pickup' ? '🏪 Store Pickup' : '🚚 Delivery';
    const payLabel = order.payment.method === 'qr' ? '📱 PromptPay QR' : '💵 ' + (order.fulfillment === 'pickup' ? 'Pay at Store' : 'Cash on Delivery');

    let itemsHtml = order.items.map(i =>
      `<div class="detail-item-row"><span>${esc(i.name)} ×${i.quantity}</span><strong>฿${(i.price*i.quantity).toLocaleString()}</strong></div>`
    ).join('');

    let slipHtml = '';
    if (order.payment.slipFile) {
      slipHtml = `<img class="detail-slip-img" src="${esc(order.payment.slipUrl)}" alt="Slip" />`;
    }

    document.getElementById('detailBody').innerHTML = `
      <div class="detail-section">
        <div class="detail-section-title">Customer</div>
        <div class="detail-row"><span>Name</span><strong>${esc(order.customer.name)}</strong></div>
        <div class="detail-row"><span>Phone</span><strong>${esc(order.customer.phone)}</strong></div>
        <div class="detail-row"><span>Method</span><strong>${ffLabel}</strong></div>
        ${order.fulfillment === 'delivery' ? `<div class="detail-row"><span>Address</span><strong style="text-align:right; max-width:60%">${esc(order.customer.address)}</strong></div>` : ''}
        ${order.notes ? `<div class="detail-row"><span>Notes</span><strong>${esc(order.notes)}</strong></div>` : ''}
      </div>
      <div class="detail-section">
        <div class="detail-section-title">Order Items</div>
        ${itemsHtml}
        <div class="detail-total">Total: ฿${order.total.toLocaleString()}</div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">Payment</div>
        <div class="detail-row"><span>Method</span><strong>${payLabel}</strong></div>
        <div class="detail-row"><span>Verified</span><strong>${order.payment.verified === true ? '✅ Yes' : order.payment.verified === false ? '⏳ Pending' : 'N/A'}</strong></div>
        ${slipHtml}
        ${order.payment.slipFile && !order.payment.verified ? `<button class="modal-btn primary" onclick="verifyPayment('${order.id}')" style="margin-top:12px; width:100%;">✓ Verify Payment</button>` : ''}
      </div>
      <div class="detail-section">
        <div class="detail-section-title">Status</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          ${['pending','confirmed','ready','completed','cancelled'].map(s => `
            <button onclick="updateStatus('${order.id}', '${s}')"
              style="padding:8px 14px; border-radius:8px; border:1.5px solid rgba(200,90,124,0.2);
                     background:${order.status===s?'var(--rose)':'white'};
                     color:${order.status===s?'white':'#777'};
                     cursor:pointer; font-family:DM Sans,sans-serif; font-size:12px; font-weight:500;">
              ${statusLabel(s)}
            </button>
          `).join('')}
        </div>
      </div>
      <div class="detail-section">
        <button class="modal-btn secondary" onclick="deleteOrder('${order.id}')"
          style="width:100%; background:#fff0f0; color:#c0392b; border:1px solid #f5c6cb; padding:12px; border-radius:12px; cursor:pointer; font-family:DM Sans,sans-serif; font-size:14px;">
          🗑️ Delete This Order
        </button>
      </div>
    `;

    document.getElementById('detailPanel').classList.add('open');
  }

  function closeDetail() {
    document.getElementById('detailPanel').classList.remove('open');
  }

  // ── TOAST ─────────────────────────────────────────────────
  function showToast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type} show`;
    setTimeout(() => { el.classList.remove('show'); }, 3000);
  }

  // ── AUTO REFRESH every 30s ────────────────────────────────
  loadOrders();
  setInterval(loadOrders, 30000);
</script>
</body>
</html>
